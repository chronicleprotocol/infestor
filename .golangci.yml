version: "2"

run:
  modules-download-mode: readonly

linters:
  default: none
  enable:
    - bodyclose
    - dogsled
    - errcheck
    - funlen
    - goconst
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - lll
    - mnd
    - nakedret
    - nolintlint
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    funlen:
      lines: 100
      statements: 40
    gocyclo:
      min-complexity: 15
    lll:
      line-length: 120
    nakedret:
      max-func-lines: 30
  exclusions:
    paths:
      - bin
      - testdata
      - testutil
    rules:
      - path: _test\.go
        linters: [dupl, funlen, mnd, lll, unused, errcheck, gosec]
      - path: /mocks/
        linters: [dupl, funlen, mnd, lll, unused, errcheck, gosec]

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # The v1 config carried `new: true` with
  # `new-from-rev: 8575515511b98d47c5d7368c50a699c873216b42`, a revision that
  # does NOT exist in this repository. It was copied in along with the config
  # from oracle-suite, so the "only report new issues" behaviour never worked
  # here. new-from-merge-base is the working equivalent: it preserves the
  # original intent (lint what a change introduces, not the whole backlog)
  # with a baseline that actually resolves.
  #
  # There are 65 pre-existing findings under this linter set (50 revive,
  # 10 goconst, 5 mnd). Adopting them is a separate decision from migrating
  # the tooling, and is deliberately not made here.
  new-from-merge-base: main

